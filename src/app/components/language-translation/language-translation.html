<main class="container my-5" *ngIf="recipe; else loadingState">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-dark text-white fw-bold">
      Translation for: {{ recipe.title }}
    </div>

    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <select class="form-select w-auto" [(ngModel)]="selectedLang">
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="it">Italian</option>
            <option value="de">German</option>
            <option value="zh">Chinese (Simplified)</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="ms">Malay</option>
            <option value="id">Indonesian</option>
            <option value="th">Thai</option>
        </select>
        <button class="btn btn-primary" (click)="translateRecipe()">Translate</button>
      </div>

      <div *ngIf="loading" class="text-center text-muted">
        <div class="spinner-border text-secondary"></div>
        <p class="mt-2">Translating recipe...</p>
      </div>

      <div *ngIf="!loading && translatedText">
        <pre class="bg-light p-3 rounded">{{ translatedText }}</pre>
      </div>

      <div class="text-end mt-3">
        <a [routerLink]="['/view-recipe-34389792', recipe.recipeId]" class="btn btn-outline-secondary">
          ← Back to Recipe
        </a>

      </div>
    </div>
  </div>
</main>

<ng-template #loadingState>
  <div class="text-center my-5 text-muted">
    <div class="spinner-border text-secondary"></div>
    <p>Loading recipe details...</p>
  </div>
</ng-template>
