<main>
  <h1 class="text-center py-3">Edit Inventory</h1>

  <div
    class="container my-4"
    style="max-width: 800px; background-color: #fff; border-radius: 12px; padding: 32px;"
  >
    <form #f="ngForm" (ngSubmit)="onSubmit(f)">
      <div>
        <label class="form-label">Inventory ID *</label>
        <input
          type="text"
          class="form-control"
          name="inventoryId"
          [(ngModel)]="inventory.inventoryId"
          readonly
        />
      </div>

        <div class="mt-2">
          <label class="form-label">User ID *</label>
          <input
            type="text"
            class="form-control"
            name="userId"
            [(ngModel)]="inventory.userId"
            required
            pattern="^U-\d{5}$"
            #userId="ngModel"
          />
          @if (userId.invalid && userId.touched) {
            <div class="text-danger small mt-1">
              @if (userId.errors?.['required']) {
                <span>User ID is required.</span>
              } @else if (userId.errors?.['pattern']) {
                <span>Format must be U-XXXXX (5 digits).</span>
              }
            </div>
          }
        </div>

      <div class="row mt-3">
        <div class="col-md-8">
          <label class="form-label">Ingredient Name *</label>
          <input
            type="text"
            class="form-control"
            name="ingredientName"
            [(ngModel)]="inventory.ingredientName"
            required
          />
        </div>
        <div class="col-md-4">
          <label class="form-label">Quantity *</label>
          <input
            type="number"
            class="form-control"
            name="quantity"
            [(ngModel)]="inventory.quantity"
            required
          />
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-4">
          <label class="form-label">Unit *</label>
          <input
            type="text"
            class="form-control"
            name="unit"
            [(ngModel)]="inventory.unit"
            required
          />
        </div>
        <div class="col-md-4">
          <label class="form-label">Category *</label>
          <input
            type="text"
            class="form-control"
            name="category"
            [(ngModel)]="inventory.category"
            required
          />
        </div>
        <div class="col-md-4">
          <label class="form-label">Cost *</label>
          <input
            type="number"
            step="0.01"
            class="form-control"
            name="cost"
            [(ngModel)]="inventory.cost"
            required
          />
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label class="form-label">Purchase Date *</label>
          <input
            type="date"
            class="form-control"
            name="purchaseDate"
            [(ngModel)]="inventory.purchaseDate"
            required
          />
        </div>
        <div class="col-md-6">
          <label class="form-label">Expiration Date *</label>
          <input
            type="date"
            class="form-control"
            name="expirationDate"
            [(ngModel)]="inventory.expirationDate"
            required
          />
        </div>
      </div>

      <div class="mt-3">
        <label class="form-label">Location *</label>
        <input
          type="text"
          class="form-control"
          name="location"
          [(ngModel)]="inventory.location"
          required
        />
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a routerLink="/inventory-34389792" class="btn btn-outline-primary">
          Cancel
        </a>
        <button type="submit" class="btn btn-primary" [disabled]="f.invalid">
          Confirm
        </button>
      </div>
    </form>
  </div>
</main>
